apiVersion: batch/v1
kind: CronJob
metadata:
  name: ddns
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # a hung run would otherwise block every future run
      activeDeadlineSeconds: 300
      template:
        spec:
          containers:
            - name: ddns
              image: ghcr.io/axle-h/ddns:latest
              imagePullPolicy: Always
              envFrom:
                - configMapRef:
                    name: ddns
                - secretRef:
                    name: ddns
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000 # node
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
          restartPolicy: OnFailure